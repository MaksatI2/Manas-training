version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: manas-postgres
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: qwerty
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - manas-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: manas-app
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - POSTGRES_PASSWORD=qwerty
      - MAIL_USERNAME=zer0icemax@gmail.com
      - MAIL_PASSWORD=chfe zivr epbv zbc
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/postgres
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=qwerty
      - JITSI_DOMAIN=157.245.67.28
      - SERVER_SSL_ENABLED=true
      - SERVER_PORT=8089
    ports:
      - "8089:8089"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - manas-network
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -f -k https://localhost:8089/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  jitsi-web:
    image: jitsi/web:stable
    container_name: manas-jitsi-web
    ports:
      - "8080:80"
      - "8443:443"
    environment:
      - ENABLE_LETSENCRYPT=0
      - ENABLE_HTTP_REDIRECT=1
      - DISABL  E_HTTPS=0
      - JICOFO_AUTH_USER=focus
      - XMPP_DOMAIN=meet.jitsi
      - XMPP_AUTH_DOMAIN=auth.meet.jitsi
      - XMPP_BOSH_URL_BASE=http://prosody:5280
      - XMPP_MUC_DOMAIN=muc.meet.jitsi
      - TZ=Asia/Bishkek
      - JVB_TCP_HARVESTER_DISABLED=true
      - ENABLE_PREJOIN_PAGE=false
      - ENABLE_WELCOME_PAGE=false
      - ENABLE_CLOSE_PAGE=false
      - DISABLE_DEEP_LINKING=true
      - ENABLE_RECORDING=false
      - ENABLE_LIVESTREAMING=false
      - RESOLUTION=720
      - RESOLUTION_MIN=180
      - RESOLUTION_MAX=1080
      - PUBLIC_URL=https://157.245.67.28
      - ENABLE_XMPP_WEBSOCKET=1
      - XMPP_CROSS_DOMAIN=true
      - ENABLE_SUBDOMAINS=false
      - WEBSOCKET_KEEP_ALIVE_URL=https://157.245.67.28/xmpp-websocket
      - NGINX_RESOLVER=127.0.0.11
      - NGINX_WORKER_PROCESSES=1
      - NGINX_WORKER_CONNECTIONS=1024
    networks:
      - manas-network
    volumes:
      - jitsi-web-config:/config
      - jitsi-web-transcripts:/usr/share/jitsi-meet/transcripts
      - ./jitsi-meet-config:/defaults
    depends_on:
      - prosody
      - jicofo
      - jvb

  prosody:
    image: jitsi/prosody:stable
    container_name: manas-prosody
    environment:
      - AUTH_TYPE=internal
      - ENABLE_GUESTS=1
      - XMPP_DOMAIN=meet.jitsi
      - XMPP_AUTH_DOMAIN=auth.meet.jitsi
      - XMPP_MUC_DOMAIN=muc.meet.jitsi
      - XMPP_INTERNAL_MUC_DOMAIN=internal-muc.meet.jitsi
      - JICOFO_COMPONENT_SECRET=jicofo-secret
      - JVB_AUTH_USER=jvb
      - JVB_AUTH_PASSWORD=jvb-password
      - JICOFO_AUTH_USER=focus
      - JICOFO_AUTH_PASSWORD=focus-password
      - TZ=Asia/Bishkek
      - ENABLE_LOBBY=1
      - LOG_LEVEL=warn
      - ENABLE_XMPP_WEBSOCKET=1
      - ENABLE_SUBDOMAINS=false
      - PUBLIC_URL=https://157.245.67.28
      - XMPP_CROSS_DOMAIN=true
      - XMPP_MODULES=websocket,http_cors
    networks:
      - manas-network
    volumes:
      - prosody-config:/config
      - prosody-plugins:/prosody-plugins-custom
    ports:
      - "5222:5222"
      - "5280:5280"
      - "5281:5281"
    restart: unless-stopped

  jicofo:
    image: jitsi/jicofo:stable
    container_name: manas-jicofo
    environment:
      - XMPP_DOMAIN=meet.jitsi
      - XMPP_AUTH_DOMAIN=auth.meet.jitsi
      - XMPP_INTERNAL_MUC_DOMAIN=internal-muc.meet.jitsi
      - JICOFO_COMPONENT_SECRET=jicofo-secret
      - JICOFO_AUTH_USER=focus
      - JICOFO_AUTH_PASSWORD=focus-password
      - JVB_BREWERY_MUC=jvbbrewery
      - JIGASI_BREWERY_MUC=jigasibrewery
      - TZ=Asia/Bishkek
      - JICOFO_ENABLE_BRIDGE_HEALTH_CHECKS=true
      - JICOFO_CONF_INITIAL_PARTICIPANT_WAIT_TIMEOUT=15000
      - JICOFO_CONF_SINGLE_PARTICIPANT_TIMEOUT=20000
      - JICOFO_ENABLE_HEALTH_CHECKS=true
    networks:
      - manas-network
    volumes:
      - jicofo-config:/config
    depends_on:
      - prosody
    restart: unless-stopped

  jvb:
    image: jitsi/jvb:stable
    container_name: manas-jvb
    environment:
      - DOCKER_HOST_ADDRESS=157.245.67.28
      - XMPP_AUTH_DOMAIN=auth.meet.jitsi
      - XMPP_INTERNAL_MUC_DOMAIN=internal-muc.meet.jitsi
      - XMPP_SERVER=prosody
      - JVB_AUTH_USER=jvb
      - JVB_AUTH_PASSWORD=jvb-password
      - JVB_BREWERY_MUC=jvbbrewery
      - JVB_PORT=10000
      - JVB_TCP_HARVESTER_DISABLED=true
      - JVB_STUN_SERVERS=stun.l.google.com:19302,stun1.l.google.com:19302,stun2.l.google.com:19302
      - TZ=Asia/Bishkek
      - JVB_ENABLE_APIS=rest,colibri
      - JVB_WS_DOMAIN=157.245.67.28
      - JVB_WS_SERVER_ID=jvb1
      - COLIBRI_REST_ENABLED=true
      - SHUTDOWN_REST_ENABLED=true
      - PUBLIC_URL=https://157.245.67.28
      - JVB_OCTO_ENABLED=false
      - JVB_WS_TLS=false
    networks:
      - manas-network
    volumes:
      - jvb-config:/config
    ports:
      - "10000:10000/udp"
      - "4443:4443"
    depends_on:
      - prosody
    restart: unless-stopped

networks:
  manas-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  postgres_data:
    driver: local
  jitsi-web-config:
    driver: local
  jitsi-web-transcripts:
    driver: local
  prosody-config:
    driver: local
  prosody-plugins:
    driver: local
  jicofo-config:
    driver: local
  jvb-config:
    driver: local