version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: manas-postgres
    environment:
      POSTGRES_DB: manasdb
      POSTGRES_USER: manasdb
      POSTGRES_PASSWORD: qwerty
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    networks:
      - manas-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U manasdb" ]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: manas-app
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - POSTGRES_PASSWORD=qwerty
      - MAIL_USERNAME=zer0icemax@gmail.com
      - MAIL_PASSWORD=chfe zivr epbv zbcp
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/postgres
      - SPRING_DATASOURCE_USERNAME=manasdb
      - SPRING_DATASOURCE_PASSWORD=qwerty
    ports:
      - "8089:8089"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - manas-network
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs
      - ./uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8089/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  manas-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local