server {
    listen 80;
    server_name manastraining.kg www.manastraining.kg;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
        try_files $uri $uri/ =404;
    }

    location /health {
        return 200 "OK";
        add_header Content-Type text/plain;
        access_log off;
    }

    location / {
        return 301 https://$server_name$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name manastraining.kg www.manastraining.kg;

    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;

    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    location /.well-known/acme-challenge/ {
        root /var/www/html;
        try_files $uri $uri/ =404;
    }

    location ~* \.(html|htm)$ {
        proxy_pass http://manas-app:8089;
        proxy_redirect off;

        add_header X-Frame-Options "SAMEORIGIN";
        add_header Content-Security-Policy "frame-ancestors 'self'";
        add_header Content-Type "text/html; charset=utf-8";
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";

        add_header Content-Disposition "inline";
        add_header X-Content-Type-Options "nosniff";
    }

    location /api/ {
        proxy_pass http://manas-app:8089;
        proxy_redirect off;
        proxy_buffering off;

        add_header X-Frame-Options "SAMEORIGIN";
    }

    location /static/ {
        proxy_pass http://manas-app:8089;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin *;
        add_header X-Frame-Options "SAMEORIGIN";
    }

    location ~* /sockjs.*/(iframe|htmlfile)\.html$ {
        proxy_pass http://manas-app:8089;
        proxy_redirect off;

        add_header X-Frame-Options "SAMEORIGIN";
        add_header Content-Security-Policy "frame-ancestors 'self' https://manastraining.kg";
        add_header Content-Type "text/html; charset=utf-8";
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        add_header Content-Disposition "inline";

        add_header X-Content-Type-Options "nosniff";
        add_header Access-Control-Allow-Origin "https://manastraining.kg";
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
        add_header Access-Control-Allow-Headers "Content-Type, Cache-Control";
        add_header Access-Control-Allow-Credentials "true";
    }

    location /auth/ {
        proxy_pass http://manas-app:8089;
        proxy_redirect off;
        add_header X-Frame-Options "SAMEORIGIN";
    }

    location /login {
        proxy_pass http://manas-app:8089;
        proxy_redirect off;
        add_header X-Frame-Options "SAMEORIGIN";
    }

    location /logout {
        proxy_pass http://manas-app:8089;
        proxy_redirect off;
        add_header X-Frame-Options "SAMEORIGIN";
    }

    location /app/ {
        proxy_pass http://manas-app:8089/app/;
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
        proxy_redirect off;
        add_header X-Frame-Options "SAMEORIGIN";
    }

    location ~ ^/(courses|users|profile|dashboard|admin|settings)(/.*)?$ {
        proxy_pass http://manas-app:8089;
        proxy_redirect off;
        add_header X-Frame-Options "SAMEORIGIN";
    }

    location /lang/ {
        proxy_pass http://manas-jitsi-web:80/lang/;
        expires 1d;
        add_header Cache-Control "public";
        add_header Access-Control-Allow-Origin *;
        add_header X-Frame-Options "SAMEORIGIN";
    }

    location /meet/pwa-worker.js {
        proxy_pass http://manas-jitsi-web:80/pwa-worker.js;
        expires 1d;
        add_header Cache-Control "public";
        add_header Access-Control-Allow-Origin *;
        add_header X-Frame-Options "SAMEORIGIN";
    }

    location /js/external_api.js {
        proxy_pass http://manas-jitsi-web:80/libs/external_api.min.js;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin *;
        add_header Content-Type "application/javascript";
        add_header X-Frame-Options "SAMEORIGIN";
    }

    location /libs/ {
        proxy_pass http://manas-jitsi-web:80/libs/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin *;
        add_header X-Frame-Options "SAMEORIGIN";
    }

    location /css/ {
        proxy_pass http://manas-jitsi-web:80/css/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin *;
        add_header X-Frame-Options "SAMEORIGIN";
    }

    location /sounds/ {
        proxy_pass http://manas-jitsi-web:80/sounds/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin *;
        add_header X-Frame-Options "SAMEORIGIN";
    }

    location /images/ {
        proxy_pass http://manas-jitsi-web:80/images/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin *;
        add_header X-Frame-Options "SAMEORIGIN";
    }

    location /colibri-ws/ {
        proxy_pass http://manas-jitsi-web:80;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        add_header X-Frame-Options "SAMEORIGIN";
    }

    location /meet/xmpp-websocket {
        proxy_pass http://manas-prosody:5280/xmpp-websocket;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        add_header X-Frame-Options "SAMEORIGIN";
    }

    location /xmpp-websocket {
        proxy_pass http://manas-prosody:5280/xmpp-websocket;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        add_header X-Frame-Options "SAMEORIGIN";
    }

    location /http-bind {
        proxy_pass http://manas-prosody:5280/http-bind;
        proxy_buffering off;
        proxy_read_timeout 300;
        proxy_send_timeout 300;
        add_header X-Frame-Options "SAMEORIGIN";
    }

    location /config.js {
        proxy_pass http://manas-jitsi-web:80/config.js;
        add_header Cache-Control "no-cache";
        add_header Access-Control-Allow-Origin *;
        add_header X-Frame-Options "SAMEORIGIN";
    }

    location /interface_config.js {
        proxy_pass http://manas-jitsi-web:80/interface_config.js;
        add_header Cache-Control "no-cache";
        add_header Access-Control-Allow-Origin *;
        add_header X-Frame-Options "SAMEORIGIN";
    }

    location ~ ^/meet/([a-zA-Z0-9_-]+)/?(.*)$ {
        proxy_pass http://manas-jitsi-web:80/$2;
        proxy_hide_header X-Frame-Options;
        proxy_redirect off;
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
        add_header Access-Control-Allow-Headers "Content-Type, Authorization";
        add_header X-Frame-Options "SAMEORIGIN";
    }

    location /meet/ {
        proxy_pass http://manas-jitsi-web:80/;
        proxy_hide_header X-Frame-Options;
        proxy_redirect off;
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
        add_header Access-Control-Allow-Headers "Content-Type, Authorization";
        add_header X-Frame-Options "SAMEORIGIN";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range';
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }

        proxy_pass http://manas-app:8089;
        add_header X-Frame-Options "SAMEORIGIN";
    }

    location / {
        proxy_pass http://manas-app:8089;
        proxy_hide_header X-Frame-Options;
        proxy_redirect off;
        add_header X-Frame-Options "SAMEORIGIN";
    }
}