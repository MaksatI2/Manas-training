server {
    listen 80;
    server_name www.manastraining.kg;
    return 301 http://manastraining.kg$request_uri;
}

server {
    listen 80;
    server_name manastraining.kg;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location /static/ {
        proxy_pass http://manas-app:8089;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin *;
    }

    location /api/ {
        proxy_pass http://manas-app:8089;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    location /app/ {
        proxy_pass http://manas-app:8089/app/;
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
        proxy_redirect off;
    }

    location /auth/ {
        proxy_pass http://manas-app:8089;
        proxy_redirect off;
    }

    location /login {
        proxy_pass http://manas-app:8089;
        proxy_redirect off;
    }

    location /logout {
        proxy_pass http://manas-app:8089;
        proxy_redirect off;
    }

    location /js/external_api.js {
        proxy_pass http://manas-jitsi-web:80/libs/external_api.min.js;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin *;
        add_header Content-Type "application/javascript";
    }

    location /libs/ {
        proxy_pass http://manas-jitsi-web:80/libs/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin *;
    }

    location /css/ {
        proxy_pass http://manas-jitsi-web:80/css/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin *;
    }

    location /sounds/ {
        proxy_pass http://manas-jitsi-web:80/sounds/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin *;
    }

    location /images/ {
        proxy_pass http://manas-jitsi-web:80/images/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin *;
    }

    location /colibri-ws/ {
        proxy_pass http://manas-jitsi-web:80;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    location /xmpp-websocket {
        proxy_pass http://manas-prosody:5280/xmpp-websocket;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    location /http-bind {
        proxy_pass http://manas-prosody:5280/http-bind;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 300;
        proxy_send_timeout 300;
    }

    location /config.js {
        proxy_pass http://manas-jitsi-web:80/config.js;
        add_header Cache-Control "no-cache";
        add_header Access-Control-Allow-Origin *;
    }

    location /interface_config.js {
        proxy_pass http://manas-jitsi-web:80/interface_config.js;
        add_header Cache-Control "no-cache";
        add_header Access-Control-Allow-Origin *;
    }

    location ~ ^/[a-zA-Z0-9_-]+$ {
        proxy_pass http://manas-jitsi-web:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Frame-Options;
        proxy_redirect off;
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
        add_header Access-Control-Allow-Headers "Content-Type, Authorization";
    }

    location / {
        proxy_pass http://manas-app:8089;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_hide_header X-Frame-Options;
    }
}