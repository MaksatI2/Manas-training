server:
  port: 8089

spring:
  application:
    name: manas-training-service

  datasource:
    url: jdbc:postgresql://localhost:8888/postgres
    username: postgres
    password: qwerty
    driver-class-name: org.postgresql.Driver

  jackson:
    time-zone: Asia/Bishkek

  management:
    endpoints:
      web:
        exposure:
          include: health,info
    endpoint:
      health:
        probes:
          enabled: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 500MB
      max-request-size: 500MB

  liquibase:
    change-log: classpath:/db/changelog/master.yaml
    enabled: true

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  output:
    ansi:
      enabled: always

  security:
    user:
      name: email
      password: password

  freemarker:
    expose-session-attributes: true

  mvc:
    static-path-pattern: /static/**

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls.enable: true
          ssl.trust: smtp.gmail.com

  task:
    scheduling:
      enabled: true

jitsi:
  domain: meet.jitsi
  port: 443
  protocol: https
  room:
    prefix: ManasTraining
  web:
    url: https://manastraining.kg

logging:
  level:
    root: info
    org:
      springframework:
        security: debug

  file:
    name: logs/spring.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7
  pattern:
    dateformat: yyyy-MM-dd HH:mm:ss.SSS

app:
  remember-me:
    token-validity-days: 365
    cookie-name: remember-me
    max-tokens-per-user: 5