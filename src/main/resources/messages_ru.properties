home.features.5.title=Мобильная платформа
home.features.5.desc=Полнофункциональное мобильное приложение для обучения в любом месте и в любое время с синхронизацией прогресса
home.features.6.title=Аналитика успеваемости
home.features.6.desc=Детальная аналитика прогресса обучения с персональными рекомендациями и планами развития компетенций

