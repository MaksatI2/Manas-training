image: maven:3.9.4-eclipse-temurin-17

stages:
  - build
  - deploy

cache:
  paths:
    - .m2/repository

services:
  - name: postgres:15
    alias: postgres

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"
  POSTGRES_DB: testdb
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres

build:
  stage: build
  script:
    - mvn clean package
  artifacts:
    paths:
      - target/*.jar

deploy:
  stage: deploy
  only:
    - dev
  script:
    - apt-get update && apt-get install -y openssh-client
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ls -l ~/.ssh
    - cat ~/.ssh/id_ed25519 | head -n 5
    - ssh-keyscan -H 157.245.67.28 >> ~/.ssh/known_hosts
    - scp -i ~/.ssh/id_ed25519 target/*.jar root@157.245.67.28:/root/app.jar
    - ssh -i ~/.ssh/id_ed25519 root@157.245.67.28 "systemctl restart app"
