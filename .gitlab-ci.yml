stages:
  - build
  - deploy

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  MAVEN_CLI_OPTS: "--batch-mode --errors --fail-at-end --show-version"

cache:
  key: "m2-cache"
  paths:
    - .m2/repository/

build:
  stage: build
  image: maven:3.8.6-eclipse-temurin-17
  script:
    - mvn $MAVEN_CLI_OPTS clean package -DskipTests

    # ВАЖНО: берём только нормальный spring boot jar
    - cp target/*SNAPSHOT.jar target/app.jar

    - echo "Build complete:"
    - ls -lh target/app.jar

  artifacts:
    paths:
      - target/app.jar
    expire_in: 1 day

  only:
    - dev


deploy:
  stage: deploy
  image: ubuntu:20.04

  # ВОТ ЭТО ИСПРАВЛЯЕТ undefined dependency
  needs:
    - job: build
      artifacts: true

  before_script:
    - apt-get update -qq
    - apt-get install -y -qq openssh-client rsync sshpass
    - mkdir -p ~/.ssh
    - ssh-keyscan -H $DEPLOY_SERVER >> ~/.ssh/known_hosts 2>/dev/null || true

  script:
    - echo "🚀 Deploy to $DEPLOY_SERVER"
    - export SSHPASS=$SSH_PASSWORD

    # 1) директория
    - sshpass -e ssh -o StrictHostKeyChecking=no $DEPLOY_USER@$DEPLOY_SERVER "mkdir -p $DEPLOY_PATH/target"

    # 2) копируем jar
    - echo "📦 Upload app.jar..."
    - sshpass -e scp -o StrictHostKeyChecking=no target/app.jar $DEPLOY_USER@$DEPLOY_SERVER:$DEPLOY_PATH/target/app.jar

    # 3) синхронизация проекта
    - echo "🔄 Rsync project files..."
    - sshpass -e rsync -avz --delete -e "ssh -o StrictHostKeyChecking=no" \
      --exclude='data' \
      --exclude='postgres/**' \
      --exclude='logs/**' \
      --exclude='nginx/ssl/**' \
      --exclude='nginx/logs' \
      --exclude='nginx/html/.well-known' \
      --exclude='letsencrypt/**' \
      --exclude='target' \
      --exclude='.git' \
      --exclude='.m2' \
      --exclude='.idea' \
      --exclude='*.iml' \
      --exclude='README.md' \
      ./ $DEPLOY_USER@$DEPLOY_SERVER:$DEPLOY_PATH/

    # 4) запуск
    - echo "🚀 Run deploy.sh..."
    - sshpass -e ssh -o StrictHostKeyChecking=no $DEPLOY_USER@$DEPLOY_SERVER "\
      cd $DEPLOY_PATH && \
      chmod +x deploy.sh 2>/dev/null || true && \
      ./deploy.sh \
      "

    - echo "✅ Deploy finished!"

  environment:
    name: production
    url: $PRODUCTION_URL

  only:
    - dev