stages:
- build
- deploy

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  MAVEN_CLI_OPTS: "--batch-mode --errors --fail-at-end --show-version"

cache:
  paths:
    - .m2/repository/
    - target/

build:
  stage: build
  image: maven:3.8.6-eclipse-temurin-17
  script:
    - mvn $MAVEN_CLI_OPTS clean package -DskipTests
  artifacts:
    paths:
      - target/*.jar
    expire_in: 1 day
  only:
    - dev

deploy:
  stage: deploy
  image: ubuntu:20.04
  before_script:
    - apt-get update -qq && apt-get install -y -qq openssh-client sshpass rsync
  script:
    - echo "Деплой на сервер 157.245.67.28"
    - sshpass -p "HMaggualm2SGj6pMjAFvSEYV" rsync -avz -e "ssh -o StrictHostKeyChecking=no" --delete ./ root@157.245.67.28:/root/manas-training-service/
    - sshpass -p "HMaggualm2SGj6pMjAFvSEYV" ssh -o StrictHostKeyChecking=no root@157.245.67.28 "cd /root/manas-training-service && chmod +x deploy.sh && ./deploy.sh"
  environment:
    name: production
    url: http://157.245.67.28:8089
  only:
    - dev
  when: manual