stages:
  - test
  - build
  - deploy

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  MAVEN_CLI_OPTS: "--batch-mode --errors --fail-at-end --show-version"

cache:
  paths:
    - .m2/repository/
    - target/

test:
  stage: test
  image: maven:3.8.6-eclipse-temurin-17
  script:
    - mvn $MAVEN_CLI_OPTS clean test
  artifacts:
    reports:
      junit:
        - target/surefire-reports/TEST-*.xml
    paths:
      - target/surefire-reports/
    expire_in: 1 week
    when: always
  coverage: '/Total.*?([0-9]{1,3})%/'
  rules:
    - when: never

build:
  stage: build
  image: maven:3.8.6-eclipse-temurin-17
  script:
    - mvn $MAVEN_CLI_OPTS compile package -DskipTests
  artifacts:
    paths:
      - target/*.jar
    expire_in: 1 day
  only:
    - dev

deploy:
  stage: deploy
  image: ubuntu:20.04
  before_script:
    - apt-get update -qq && apt-get install -y -qq openssh-client rsync sshpass
    - mkdir -p ~/.ssh
    - ssh-keyscan -H $DEPLOY_SERVER >> ~/.ssh/known_hosts 2>/dev/null || true
  script:
    - echo "🚀 Деплой на сервер $DEPLOY_SERVER"
    - export SSHPASS=$SSH_PASSWORD

    # Создаем директорию target
    - sshpass -e ssh -o StrictHostKeyChecking=no $DEPLOY_USER@$DEPLOY_SERVER "mkdir -p $DEPLOY_PATH/target"

    # Копируем jar файл
    - echo "📦 Копирование JAR файла..."
    - ls -la target/*.jar || (echo "❌ JAR файл не найден!" && exit 1)
    - sshpass -e scp -o StrictHostKeyChecking=no target/*.jar $DEPLOY_USER@$DEPLOY_SERVER:$DEPLOY_PATH/target/

    # Синхронизируем файлы (исправленная версия)
    - echo "🔄 Синхронизация файлов..."
    - sshpass -e rsync -avz --delete -e "ssh -o StrictHostKeyChecking=no" \
      --exclude='data' \
      --exclude='postgres/**' \
      --exclude='logs/**' \
      --exclude='nginx/ssl/**' \
      --exclude='nginx/logs' \
      --exclude='nginx/html/.well-known' \
      --exclude='letsencrypt/**' \
      --exclude='target' \
      --exclude='.git' \
      --exclude='.m2' \
      --exclude='.idea' \
      --exclude='*.iml' \
      --exclude='README.md' \
      ./ $DEPLOY_USER@$DEPLOY_SERVER:$DEPLOY_PATH/

    # Проверяем и устанавливаем права на скрипты
    - echo "🔧 Настройка скриптов..."
    - sshpass -e ssh -o StrictHostKeyChecking=no $DEPLOY_USER@$DEPLOY_SERVER "
      cd $DEPLOY_PATH &&
      if [ -f deploy.sh ]; then chmod +x deploy.sh; else echo '⚠️ deploy.sh не найден'; fi &&
      if [ -f setup-ssl.sh ]; then chmod +x setup-ssl.sh; else echo '⚠️ setup-ssl.sh не найден'; fi
      "

    # Запускаем деплой скрипт
    - echo "🚀 Запуск deploy.sh..."
    - sshpass -e ssh -o StrictHostKeyChecking=no $DEPLOY_USER@$DEPLOY_SERVER "
      cd $DEPLOY_PATH &&
      if [ -f deploy.sh ]; then
      ./deploy.sh
      else
      echo '❌ deploy.sh не найден, пропускаем запуск'
      exit 1
      fi
      "

    - echo "✅ Деплой завершен успешно!"
  dependencies:
    - build
  environment:
    name: production
    url: $PRODUCTION_URL
  only:
    - dev