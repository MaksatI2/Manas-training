stages:
  - build
  - deploy

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  MAVEN_CLI_OPTS: "--batch-mode --errors --fail-at-end --show-version"

cache:
  paths:
    - .m2/repository/

build:
  stage: build
  image: maven:3.8.6-eclipse-temurin-17
  script:
    - mvn $MAVEN_CLI_OPTS clean package -DskipTests
  artifacts:
    paths:
      - target/*.jar
    expire_in: 1 day
  only:
    - dev

deploy:
  stage: deploy
  image: ubuntu:20.04
  before_script:
    - apt-get update -qq && apt-get install -y -qq openssh-client rsync
    - eval "$(ssh-agent -s)"
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - |
      cat > /tmp/deploy_key << EOF
      -----BEGIN OPENSSH PRIVATE KEY-----
      $SSH_PRIVATE_KEY
      -----END OPENSSH PRIVATE KEY-----
      EOF
    - chmod 600 /tmp/deploy_key
    - ssh-add /tmp/deploy_key
    - ssh-keyscan -H $DEPLOY_SERVER >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    - echo "Деплой на сервер $DEPLOY_SERVER"
    - ssh $DEPLOY_USER@$DEPLOY_SERVER "mkdir -p $DEPLOY_PATH"

    - rsync -avz target/*.jar $DEPLOY_USER@$DEPLOY_SERVER:$DEPLOY_PATH/target/

    - rsync -avz --delete \
        --exclude='data/**' \
        --exclude='postgres/**' \
        --exclude='logs/**' \
        --exclude='nginx/ssl/**' \
        --exclude='nginx/logs/**' \
        --exclude='nginx/html/.well-known/**' \
        --exclude='.git/**' \
        --exclude='.m2/**' \
        --exclude='target/**' \
        --exclude='src/test/**' \
        --exclude='**/*.class' \
        --exclude='.idea/**' \
        --exclude='.vscode/**' \
        --exclude='*.iml' \
        --exclude='*.log' \
        ./ $DEPLOY_USER@$DEPLOY_SERVER:$DEPLOY_PATH/

    - ssh $DEPLOY_USER@$DEPLOY_SERVER "cd $DEPLOY_PATH && chmod +x deploy.sh setup-ssl.sh"
    - ssh $DEPLOY_USER@$DEPLOY_SERVER "cd $DEPLOY_PATH && ./deploy.sh"
  environment:
    name: production
    url: $PRODUCTION_URL
  only:
    - dev