stages:
  - build
  - deploy

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  MAVEN_CLI_OPTS: "--batch-mode --errors --fail-at-end --show-version"

cache:
  paths:
    - .m2/repository/
    - target/

build:
  stage: build
  image: maven:3.8.6-eclipse-temurin-17
  script:
    - mvn $MAVEN_CLI_OPTS clean package -DskipTests
  artifacts:
    paths:
      - target/*.jar
    expire_in: 1 day
  only:
    - dev

deploy:
  stage: deploy
  image: ubuntu:20.04
  before_script:
    - apt-get update -qq && apt-get install -y -qq openssh-client rsync
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan -H $SERVER_HOST >> ~/.ssh/known_hosts
  script:
    - echo "🚀 Деплой на сервер $SERVER_HOST"
    - ssh $SSH_USER@$SERVER_HOST "mkdir -p /home/$SSH_USER/manas-training-service"
    - rsync -avz -e "ssh -o StrictHostKeyChecking=no" --delete ./ $SSH_USER@$SERVER_HOST:/home/$SSH_USER/manas-training-service/
    - ssh $SSH_USER@$SERVER_HOST "cd /home/$SSH_USER/manas-training-service && chmod +x deploy.sh && chmod +x install-docker.sh && chmod +x setup-ssl.sh"
    - ssh $SSH_USER@$SERVER_HOST "cd /home/$SSH_USER/manas-training-service && ./install-docker.sh"
    - ssh $SSH_USER@$SERVER_HOST "cd /home/$SSH_USER/manas-training-service && ./deploy.sh"
  environment:
    name: production
    url: https://manastraining.kg
  only:
    - dev
  when: manual