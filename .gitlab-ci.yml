stages:
  - deploy

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  MAVEN_CLI_OPTS: "--batch-mode --errors --fail-at-end --show-version"
  DEPLOY_SERVER: "195.38.165.94"
  DEPLOY_USER: "manastraining_kg"
  DEPLOY_PATH: "/home/manastraining_kg/manas-training-service"
  PRODUCTION_URL: "https://manastraining.kg"

cache:
  paths:
    - .m2/repository/
    - target/

deploy:
  stage: deploy
  image: ubuntu:20.04
  before_script:
    - apt-get update -qq && apt-get install -y -qq sshpass rsync
  script:
    - echo "🚀 Деплой на сервер $DEPLOY_SERVER"
    - sshpass -p "$DEPLOY_PASS" ssh -o StrictHostKeyChecking=no $DEPLOY_USER@$DEPLOY_SERVER "mkdir -p $DEPLOY_PATH"
    - sshpass -p "$DEPLOY_PASS" rsync -avz --delete \
      --exclude='postgres/**' \
      --exclude='logs/**' \
      --exclude='nginx/ssl/**' \
      --exclude='nginx/ssl' \
      --exclude='nginx/logs' \
      --exclude='nginx/html/.well-known' \
      ./ $DEPLOY_USER@$DEPLOY_SERVER:$DEPLOY_PATH/
    - sshpass -p "$DEPLOY_PASS" ssh -o StrictHostKeyChecking=no $DEPLOY_USER@$DEPLOY_SERVER "cd $DEPLOY_PATH && chmod +x deploy.sh && chmod +x setup-ssl.sh"
    - sshpass -p "$DEPLOY_PASS" ssh -o StrictHostKeyChecking=no $DEPLOY_USER@$DEPLOY_SERVER "cd $DEPLOY_PATH && ./deploy.sh"
  environment:
    name: production
    url: $PRODUCTION_URL
  only:
    - dev
  when: manual