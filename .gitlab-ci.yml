stages:
  - build
  - deploy

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  MAVEN_CLI_OPTS: "--batch-mode --errors --fail-at-end --show-version"

cache:
  paths:
    - .m2/repository/
    - target/

build:
  stage: build
  image: maven:3.8.6-eclipse-temurin-17
  script:
    - mvn $MAVEN_CLI_OPTS clean package -DskipTests
  artifacts:
    paths:
      - target/*.jar
    expire_in: 1 day
  only:
    - dev

deploy:
  stage: deploy
  image: ubuntu:20.04
  before_script:
    - apt-get update -qq && apt-get install -y -qq openssh-client sshpass rsync
  script:
    - echo "Деплой на новый сервер 195.38.165.94"
    - sshpass -p "manastraining14072025_kg" ssh -o StrictHostKeyChecking=no manastraining_kg@195.38.165.94 "mkdir -p /home/manastraining_kg/manas-training-service"
    - sshpass -p "manastraining14072025_kg" rsync -avz -e "ssh -o StrictHostKeyChecking=no" --delete ./ manastraining_kg@195.38.165.94:/home/manastraining_kg/manas-training-service/
    - sshpass -p "manastraining14072025_kg" ssh -o StrictHostKeyChecking=no manastraining_kg@195.38.165.94 "cd /home/manastraining_kg/manas-training-service && chmod +x deploy.sh && chmod +x install-docker.sh && chmod +x setup-ssl.sh"
    - sshpass -p "manastraining14072025_kg" ssh -o StrictHostKeyChecking=no manastraining_kg@195.38.165.94 "cd /home/manastraining_kg/manas-training-service && ./install-docker.sh"
    - sshpass -p "manastraining14072025_kg" ssh -o StrictHostKeyChecking=no manastraining_kg@195.38.165.94 "cd /home/manastraining_kg/manas-training-service && ./deploy.sh"
  environment:
    name: production
    url: https://manastraining.kg
  only:
    - dev
  when: manual