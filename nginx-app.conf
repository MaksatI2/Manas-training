server {
    listen 80;
    server_name 157.245.67.28 localhost;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl;
    server_name 157.245.67.28 localhost;

    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://157.245.67.28; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; media-src 'self' blob:; connect-src 'self' wss://157.245.67.28 https://157.245.67.28 https://stun.l.google.com:19302; frame-src 'self' https://157.245.67.28; frame-ancestors 'self' https://157.245.67.28;";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
    add_header X-Frame-Options "SAMEORIGIN";

    proxy_buffering off;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    access_log /var/log/nginx/jitsi_access.log;
    error_log /var/log/nginx/jitsi_error.log;

    location /static/ {
        proxy_pass http://localhost:8089;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin *;
    }

    location /api/ {
        proxy_pass http://localhost:8089;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /app/ {
        proxy_pass http://localhost:8089/;
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
    }

    location /js/external_api.js {
        proxy_pass http://localhost:8080/libs/external_api.min.js;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin *;
        add_header Content-Type "application/javascript";
        proxy_hide_header X-Frame-Options;
    }

    location /libs/ {
        proxy_pass http://localhost:8080/libs/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin *;
        proxy_hide_header X-Frame-Options;
    }

    location /css/ {
        proxy_pass http://localhost:8080/css/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin *;
        proxy_hide_header X-Frame-Options;
    }

    location /sounds/ {
        proxy_pass http://localhost:8080/sounds/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin *;
        proxy_hide_header X-Frame-Options;
    }

    location /images/ {
        proxy_pass http://localhost:8080/images/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin *;
        proxy_hide_header X-Frame-Options;
    }

    location /colibri-ws/ {
        proxy_pass http://localhost:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_hide_header X-Frame-Options;
    }

    location /xmpp-websocket {
        proxy_pass http://localhost:5280/xmpp-websocket;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_hide_header X-Frame-Options;
    }

    location /http-bind {
        proxy_pass http://localhost:5280/http-bind;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 300;
        proxy_send_timeout 300;
        proxy_hide_header X-Frame-Options;
    }

    location /config.js {
        proxy_pass http://localhost:8080/config.js;
        add_header Cache-Control "no-cache";
        add_header Access-Control-Allow-Origin *;
        proxy_hide_header X-Frame-Options;
    }

    location /interface_config.js {
        proxy_pass http://localhost:8080/interface_config.js;
        add_header Cache-Control "no-cache";
        add_header Access-Control-Allow-Origin *;
        proxy_hide_header X-Frame-Options;
    }

    location ~ ^/[a-zA-Z0-9_-]+$ {
        proxy_pass http://localhost:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_hide_header X-Frame-Options;
        add_header X-Frame-Options "SAMEORIGIN";
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
        add_header Access-Control-Allow-Headers "Content-Type, Authorization";
    }

    location / {
        proxy_pass http://localhost:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_hide_header X-Frame-Options;
        add_header X-Frame-Options "SAMEORIGIN";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://157.245.67.28; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; media-src 'self' blob:; connect-src 'self' wss://157.245.67.28 https://157.245.67.28; frame-src 'self' https://157.245.67.28; frame-ancestors 'self' https://157.245.67.28;";
    }
}